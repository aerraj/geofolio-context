name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: geofolio demo --output context.json
      - run: python -m pip wheel --no-deps . -w dist
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t geofolio .
      - run: docker run -d --name smoke -p 127.0.0.1:8000:8000 -e GEOFOLIO_TOKEN=ci-only-test-key geofolio geofolio serve --mode demo --host 0.0.0.0 --data-dir /data
      - run: curl --retry 15 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:8000/health
      - run: curl --fail -H 'Authorization:Bearer ci-only-test-key' http://127.0.0.1:8000/v1/context -o /tmp/context.json
      - run: python -c "import json; assert json.load(open('/tmp/context.json'))['context']['quality']['status']=='ready'"
