services:
  geofolio:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - workspace:/data
    command: ["geofolio", "serve", "--mode", "live", "--host", "0.0.0.0", "--data-dir", "/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  workspace:
